map $arg_action $eticket_login_key {
    default "";
    login $binary_remote_addr;
}
limit_req_zone $eticket_login_key zone=eticket_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /crear-consulta.html { try_files /index.html =404; }
    location = /panel-atencion.html { try_files /index.html =404; }
    client_max_body_size 11m;
    location = /api {
        limit_req zone=eticket_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $glpi_upstream http://glpi;
        proxy_pass $glpi_upstream/plugins/etickethub/front/api.php$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
