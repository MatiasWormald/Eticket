map $arg_action $eticket_login_key {
    default "";
    login $binary_remote_addr;
    register $binary_remote_addr;
}
limit_req_zone $eticket_login_key zone=eticket_login:10m rate=10r/m;
map "$https:$http_x_forwarded_proto" $eticket_hsts {
    default "";
    ~on: "max-age=31536000; includeSubDomains";
    ~:https "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /crear-consulta.html { try_files /index.html =404; }
    location = /panel-atencion.html { try_files /index.html =404; }
    client_max_body_size 11m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $eticket_hsts always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    location = /api {
        limit_req zone=eticket_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $glpi_upstream http://glpi;
        proxy_pass $glpi_upstream/plugins/etickethub/front/api.php$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $eticket_hsts always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
