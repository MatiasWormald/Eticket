server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Los prototipos de niveles 2/3 no se publican en el nivel 1.
    location = /crear-consulta.html { return 302 /consultas.html; }
    location = /panel-atencion.html { return 302 /consultas.html; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
